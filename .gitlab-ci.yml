stages:
  - mavenbuild
  - maventest
  - mavendeploy
  - androidbuild
  - androidtest

maven-build:
  stage: mavenbuild
  tags:
    - springboot_tag
  before_script:
    - export JAVA_HOME="/"
  script:
    - cd Backend/nutriFit
    - mvn package
  artifacts:
    paths:
      - Backend/nutriFit/target/*.jar
  only:
    refs:
      - main
    changes:
      - Backend/**/*

maven-test:
  stage: maventest
  tags:
    - springboot_tag
  before_script:
    - export JAVA_HOME="/"
  script:
    - cd Backend/nutriFit
    - mvn test
  only:
    refs:
      - main
    changes:
      - Backend/**/*


auto-deploy:
  stage: mavendeploy
  tags:
    - springboot_tag
  before_script:
    - export JAVA_HOME="/"
  script:
    - cd Backend/nutriFit
    - sudo mv target/*.jar /target/web-demo.jar 
    - sudo systemctl stop system-web-demo
    - sudo systemctl start system-web-demo
  only:
    refs:
      - main
    changes:
      - Backend/**/*

android-build:
  image: afirefly/android-ci:java17
  stage: androidbuild
  tags:
    - android_tag
  before_script:
    - export GRADLE_USER_HOME=`pwd`/.gradle
    - chmod +x ./Frontend/tutorials-android_unit1_3_login_signup/tutorials-android_unit1_3_login_signup/AndroidExample/gradlew
  script:
    - cd Frontend/tutorials-android_unit1_3_login_signup/tutorials-android_unit1_3_login_signup/AndroidExample
    - ./gradlew build
  only:
    refs:
      - main
    changes:
      - Frontend/**/*

android-test:
  image: afirefly/android-ci:java17
  stage: androidtest
  tags:
    - android_tag
  before_script:
    - export GRADLE_USER_HOME=`pwd`/.gradle
    - chmod +x ./Frontend/tutorials-android_unit1_3_login_signup/tutorials-android_unit1_3_login_signup/AndroidExample/gradlew
  script:
    - cd Frontend/tutorials-android_unit1_3_login_signup/tutorials-android_unit1_3_login_signup/AndroidExample
    - ./gradlew test
  only:
    refs:
      - main
    changes:
      - Frontend/**/*